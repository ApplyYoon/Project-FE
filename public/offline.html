<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#4f46e5" />
    <title>STARFLOW · 오프라인</title>
    <!--
      인터넷이 끊겼을 때 서비스 워커(sw.js)가 대신 보여주는 화면입니다.
      React·Tailwind 없이도 떠야 해서, 스타일을 이 파일 안에 직접 씁니다.
    -->
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 16px;
        box-sizing: border-box;
        font-family:
          system-ui,
          -apple-system,
          sans-serif;
        background: #f8fafc;
        color: #0f172a;
        text-align: center;
      }
      img {
        width: 64px;
        height: 64px;
        max-width: 100%;
        border-radius: 16px;
      }
      h1 {
        margin: 16px 0 8px;
        font-size: 20px;
      }
      p {
        margin: 0;
        font-size: 14px;
        color: #475569;
      }
      button {
        margin-top: 20px;
        height: 44px;
        padding: 0 20px;
        border: 0;
        border-radius: 8px;
        background: #4f46e5;
        color: #ffffff;
        font-size: 14px;
        font-weight: 600;
      }
    </style>
  </head>
  <body>
    <main>
      <img src="/icons/icon-192.png" alt="" />
      <h1>인터넷 연결이 끊겼어요</h1>
      <p>연결되면 다시 시도해 줘. 공부 기록은 이 기기에 그대로 남아 있어.</p>
      <button type="button" onclick="location.reload()">다시 시도</button>
    </main>
  </body>
</html>
